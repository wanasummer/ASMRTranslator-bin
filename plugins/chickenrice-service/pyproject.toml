[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asmr-chickenrice-service"
version = "0.3.0"
description = "Modular Japanese ASR service with optional ChickenRice VAD and Chinese translation"
requires-python = ">=3.10,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
engine = [
    "ctranslate2==4.8.1",
    "faster-whisper>=1.0,<2",
    "huggingface-hub>=0.28,<1",
    "librosa>=0.10,<1",
    "onnxruntime>=1.18,<2",
    "pyjson5>=1.6,<2",
    "requests>=2.28,<3",
    "transformers>=4.30,<5",
]
engine-gpu = [
    "ctranslate2==4.8.1",
    "faster-whisper>=1.0,<2",
    "huggingface-hub>=0.28,<1",
    "librosa>=0.10,<1",
    "onnxruntime-gpu>=1.18,<2",
    "pyjson5>=1.6,<2",
    "requests>=2.28,<3",
    "transformers>=4.30,<5",
    "nvidia-cublas-cu12==12.4.5.8; platform_system == 'Windows'",
    "nvidia-cudnn-cu12==9.1.1.17; platform_system == 'Windows'",
]
test = ["httpx>=0.27,<1"]

[project.scripts]
chickenrice-service = "chickenrice_service.__main__:main"
chickenrice-bootstrap = "chickenrice_service.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]
