[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asmr-genie-tts-service"
version = "0.1.0"
description = "Standalone Genie TTS engine plugin for ASMRTranslator"
requires-python = ">=3.10,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "genie-tts==2.0.2",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
genie-tts-service = "genie_tts_service.__main__:main"
genie-tts-bootstrap = "genie_tts_service.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]
